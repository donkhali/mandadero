<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TÚ MANDADERO</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  
  <meta name="theme-color" content="#006A38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tú Mandadero">
  
  <style>
    :root {
      --verde-principal: #006A38;
      --verde-claro: #4CAF50;
      --naranja-accent: #FF7A00;
      --morado-accent: #A12BB3;
      --fondo-app: #F2F5F3;
      --card-bg: #FFFFFF;
      --texto-oscuro: #1A2E24;
      --borde-input: #D2E0D8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--fondo-app); color: var(--texto-oscuro); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    
    .card { background-color: var(--card-bg); padding: 25px 20px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0, 106, 56, 0.1); border: 1px solid rgba(0, 106, 56, 0.08); position: relative; }
    
    .header { margin-bottom: 15px; }
    .header .app-logo { width: 85px; height: 85px; object-fit: contain; margin-bottom: 8px; }
    .header h1 { font-size: 22px; color: var(--verde-principal); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
    .header p { font-size: 13px; color: #556B60; margin-top: 4px; font-weight: 500; }
    
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; margin-top: 6px; }
    .status-open { background-color: #E8F5E9; color: var(--verde-principal); border: 1px solid var(--verde-claro); }
    .status-closed { background-color: #FFEBEE; color: #C62828; border: 1px solid #EF9A9A; }

    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 12px; color: var(--verde-principal); font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
    
    input, select, textarea {
      width: 100%; background: #F9FBF9; border: 1.5px solid var(--borde-input); color: var(--texto-oscuro); padding: 12px; border-radius: 10px; font-size: 14px; outline: none; transition: all 0.3s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--verde-claro); background: #FFFFFF; box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15); }
    select option { background-color: #FFFFFF; color: var(--texto-oscuro); }
    textarea { resize: none; height: 65px; }

    .btn-gps {
      width: 100%; background: #E8F5E9; color: var(--verde-principal); border: 1.5px dashed var(--verde-claro); padding: 10px; font-size: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; transition: background 0.2s;
    }
    .btn-gps:active { background: #C8E6C9; }

    .price-box { background-color: #EBF5EE; border: 1px dashed var(--verde-claro); border-radius: 12px; padding: 14px; margin: 18px 0; text-align: center; }
    .price-box span { font-size: 19px; font-weight: 800; color: var(--verde-principal); }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--naranja-accent), #FF5500); color: #FFFFFF; border: none; padding: 15px; font-weight: 800; border-radius: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3);
    }
    .btn-submit:active { transform: scale(0.98); }
    
    .footer-note { font-size: 11px; color: var(--morado-accent); margin-top: 15px; font-weight: 600; }

    /* Modal Emergente Personalizado */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: white; padding: 20px; border-radius: 16px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-box h3 { color: var(--verde-principal); margin-bottom: 8px; font-size: 18px; }
    .modal-box p { font-size: 13px; color: #555; margin-bottom: 16px; }
    .modal-btn { background: var(--verde-principal); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <img src="logo.png" alt="Tú Mandadero Logo" class="app-logo">
      <h1>TÚ MANDADERO</h1>
      <p>La solución tecnológica para tu Delivery y mandados</p>
      <div id="horarioBadge" class="status-badge status-open">Verificando horario...</div>
    </div>

    <form id="deliveryForm">
      <div class="form-group">
        <label>📞 Tu Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ej: 04143397243" onchange="guardarTelefonoLocal()" required>
      </div>

      <div class="form-group">
        <label>📍 ¿Dónde buscamos el paquete / retiro?</label>
        <select id="origen" onchange="calcularTarifa()" required>
          <option value="" disabled selected>Cargando zonas...</option>
        </select>
      </div>

      <div class="form-group">
        <label>🏁 ¿A dónde entregamos?</label>
        <select id="destino" onchange="calcularTarifa()" required>
          <option value="" disabled selected>Cargando zonas...</option>
        </select>
      </div>

      <div class="price-box">
        <span id="txtResultado">Conectando con Google Sheets...</span>
      </div>

      <div class="form-group">
        <label>🗺️ Lugar exacto / Referencia / Paquete</label>
        <textarea id="referencia" placeholder="Describe qué hay que llevar o dirección exacta..."></textarea>
        <button type="button" class="btn-gps" onclick="obtenerUbicacionGPS()">
          <span id="gpsIcon">📍</span> <span id="gpsTexto">Adjuntar mi ubicación GPS exacto</span>
        </button>
      </div>

      <button type="button" class="btn-submit" onclick="enviarWhatsApp()">
        <span>🛒</span> SOLICITAR DELIVERY
      </button>
    </form>

    <p class="footer-note">Esta es una versión DEMO de prueba.</p>
  </div>

  <!-- Modal Personalizado -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <h3 id="modalTitulo">Aviso</h3>
      <p id="modalMensaje">Mensaje de notificación</p>
      <button class="modal-btn" onclick="cerrarModal()">Aceptar</button>
    </div>
  </div>

  <script>
    const PHONE_NUMBER = "584143397243";
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS2XPrZvgzk_CYrEKrnOSdjU6E6Kt9_miaCh_fDGauVk6uxEiSs8rNmjxY76p_sehq0rIBh9fmhMBr_/pub?gid=0&single=true&output=csv";

    // Horarios de atención (Formato 24 Horas: 8 AM a 8 PM)
    const HORA_INICIO = 8;
    const HORA_FIN = 20;

    let ZONAS_DATA = {};
    let MATRIZ_PRECIOS = {};
    let precioActual = 0.0;
    let enlaceGPS = "";

    // --- MODAL PERSONALIZADO ---
    function mostrarModal(titulo, mensaje) {
      document.getElementById("modalTitulo").innerText = titulo;
      document.getElementById("modalMensaje").innerText = mensaje;
      document.getElementById("customModal").classList.add("active");
    }

    function cerrarModal() {
      document.getElementById("customModal").classList.remove("active");
    }

    // --- MANEJO DE LOCALSTORAGE ---
    function cargarTelefonoLocal() {
      const telGuardado = localStorage.getItem("mandadero_telefono");
      if (telGuardado) {
        document.getElementById("telefono").value = telGuardado;
      }
    }

    function guardarTelefonoLocal() {
      const val = document.getElementById("telefono").value.trim();
      if (val) {
        localStorage.setItem("mandadero_telefono", val);
      }
    }

    // --- CONTROL DE HORARIO OPERATIVO ---
    function verificarHorario() {
      const horaActual = new Date().getHours();
      const badge = document.getElementById("horarioBadge");

      if (horaActual >= HORA_INICIO && horaActual < HORA_FIN) {
        badge.className = "status-badge status-open";
        badge.innerText = "🟢 Abierto (8:00 AM - 8:00 PM)";
      } else {
        badge.className = "status-badge status-closed";
        badge.innerText = "🔴 Fuera de horario (Atención a 1ra hora)";
      }
    }

    // --- GEOLOCALIZACIÓN GPS NATIVA ---
    function obtenerUbicacionGPS() {
      const btnTexto = document.getElementById("gpsTexto");
      const btnIcon = document.getElementById("gpsIcon");

      if (!navigator.geolocation) {
        mostrarModal("GPS no soportado", "Tu navegador no permite obtener la ubicación GPS.");
        return;
      }

      btnTexto.innerText = "Obteniendo coordenadas...";
      btnIcon.innerText = "⏳";

      navigator.geolocation.getCurrentPosition(
        function(posicion) {
          const lat = posicion.coords.latitude;
          const lng = posicion.coords.longitude;
          enlaceGPS = "https://maps.google.com/?q=" + lat + "," + lng;
          
          btnTexto.innerText = "Ubicación GPS adjuntada ✔️";
          btnIcon.innerText = "✅";
        },
        function(error) {
          btnTexto.innerText = "Adjuntar mi ubicación GPS exacto";
          btnIcon.innerText = "📍";
          mostrarModal("Error de GPS", "Asegúrate de activar el GPS de tu teléfono y conceder los permisos.");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function parsearPrecioDecimal(valorTexto) {
      if (!valorTexto) return 0.0;
      let limpio = valorTexto.replace(/[^0-9.,]/g, '').trim();
      limpio = limpio.replace(',', '.');
      let numero = parseFloat(limpio);
      return isNaN(numero) ? 0.0 : numero;
    }

    async function cargarBaseDeDatos() {
      const txtResultado = document.getElementById("txtResultado");
      try {
        const respuesta = await fetch(SHEET_CSV_URL);
        if (!respuesta.ok) throw new Error("Error conectando con la hoja");
        
        const csvTexto = await respuesta.text();
        const filas = csvTexto.split(/\r?\n/).filter(function(f) { return f.trim() !== ""; });
        
        ZONAS_DATA = {};
        MATRIZ_PRECIOS = {};

        filas.forEach(function(fila, index) {
          const separador = fila.includes(";") ? ";" : ",";
          const columnas = fila.split(separador).map(function(c) {
            return c.trim().replace(/^"|"$/g, '');
          });

          if (index === 0 && isNaN(parseFloat(columnas[0]))) return;

          if (columnas.length >= 5) {
            const idO = columnas[0];
            const nomO = columnas[1];
            const idD = columnas[2];
            const nomD = columnas[3];
            const precio = parsearPrecioDecimal(columnas[4]);

            if (idO && nomO) ZONAS_DATA[idO] = nomO;
            if (idD && nomD) ZONAS_DATA[idD] = nomD;

            if (precio > 0) {
              MATRIZ_PRECIOS[idO + "-" + idD] = precio;
            }
          }
        });

        if (Object.keys(ZONAS_DATA).length === 0) {
          txtResultado.innerText = "Revisa el permiso de la hoja en Google Sheets";
          return;
        }

        poblarDesplegables();
      } catch (error) {
        console.error("Error al cargar la BD:", error);
        txtResultado.innerText = "Error al conectar con la base de datos";
      }
    }

    function poblarDesplegables() {
      const selectO = document.getElementById("origen");
      const selectD = document.getElementById("destino");

      selectO.innerHTML = '<option value="" disabled selected>Selecciona origen (retiro)</option>';
      selectD.innerHTML = '<option value="" disabled selected>Selecciona destino (entrega)</option>';

      Object.keys(ZONAS_DATA).forEach(function(id) {
        const optO = document.createElement("option");
        optO.value = id;
        optO.textContent = ZONAS_DATA[id];
        selectO.appendChild(optO);

        const optD = document.createElement("option");
        optD.value = id;
        optD.textContent = ZONAS_DATA[id];
        selectD.appendChild(optD);
      });

      document.getElementById("txtResultado").innerText = "Selecciona la ruta del envío";
    }

    function calcularTarifa() {
      const selectO = document.getElementById("origen");
      const selectD = document.getElementById("destino");
      const txtResultado = document.getElementById("txtResultado");

      if (!selectO || !selectD) return;

      const o = selectO.value;
      const d = selectD.value;

      if (!o || !d) {
        txtResultado.innerText = "Selecciona la ruta del envío";
        precioActual = 0.0;
        return;
      }

      const rutaKey = o + "-" + d;
      precioActual = MATRIZ_PRECIOS[rutaKey] || 0.0;

      if (precioActual > 0) {
        txtResultado.innerText = "Total Estimado: $" + precioActual.toFixed(2);
      } else {
        txtResultado.innerText = "Ruta no tarifada aún";
      }
    }

    function enviarWhatsApp() {
      const telefono = document.getElementById("telefono").value;
      const referencia = document.getElementById("referencia").value;
      const o = document.getElementById("origen").value;
      const d = document.getElementById("destino").value;

      if (!o || !d || precioActual === 0) {
        mostrarModal("Selección incompleta", "Selecciona un origen y un destino válidos antes de continuar.");
        return;
      }

      guardarTelefonoLocal();

      const nombreOrigen = ZONAS_DATA[o] || "Desconocido";
      const nombreDestino = ZONAS_DATA[d] || "Desconocido";

      let texto = "*SOLICITUD DE DELIVERY - TÚ MANDADERO*\n" +
                  "Origen (Retiro): " + nombreOrigen + "\n" +
                  "Destino (Entrega): " + nombreDestino + "\n" +
                  "Teléfono: " + telefono + "\n" +
                  "Detalles/Ref: " + referencia + "\n";

      if (enlaceGPS !== "") {
        texto += "📍 Ubicación GPS: " + enlaceGPS + "\n";
      }

      texto += "💰 *Precio Estimado: $" + precioActual.toFixed(2) + "*";

      const url = "https://wa.me/" + PHONE_NUMBER + "?text=" + encodeURIComponent(texto);
      window.open(url, "_blank");
    }

    document.addEventListener("DOMContentLoaded", function() {
      cargarTelefonoLocal();
      verificarHorario();
      cargarBaseDeDatos();
    });

    const manifestData = {
      name: "TÚ MANDADERO",
      short_name: "Tú Mandadero",
      start_url: ".",
      display: "standalone",
      background_color: "#F2F5F3",
      theme_color: "#006A38",
      icons: [
        { src: "logo.png", sizes: "192x192", type: "image/png" },
        { src: "logo.png", sizes: "512x512", type: "image/png" }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = "self.addEventListener('install', function(e) { self.skipWaiting(); });" +
                     "self.addEventListener('fetch', function(e) { e.respondWith(fetch(e.request).catch(function() { return caches.match(e.request); })); });";
      const swBlob = new Blob([swCode], { type: 'text/javascript' });
      const swURL = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL + '?v=10').catch(function() {});
    }
  </script>
</body>
</html>
